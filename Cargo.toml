[package]
name = "modbus-proxy-rs"
version = "0.1.0"
edition = "2021"
description = "Modbus TCP proxy that multiplexes multiple client connections onto a single upstream connection per device"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
